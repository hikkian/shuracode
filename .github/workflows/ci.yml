name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Python
        run: |
          python -m py_compile mcp/*.py tests/*.py
          pip install --quiet ruff
          ruff check mcp tests --select E,F,W,B --ignore E501
      - name: Memory unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Shell
        run: shellcheck bin/shuracode install.sh
      - name: JSON
        run: |
          for f in themes/*.json mcp/*.json; do python -m json.tool "$f" > /dev/null && echo "ok $f"; done
          for f in config/*.json.in; do sed "s|@[A-Z_]*@|x|g" "$f" | python -m json.tool > /dev/null && echo "ok $f"; done
      - name: MCP filter parses
        run: node --check mcp/mcp-tool-filter.js

  engine:
    # Install into a throwaway home: downloads the pinned engine and runs the self-test
    # (logo, footer, window title, and the agent's name in the system prompt).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: install.sh + self-test
        run: |
          export HOME="$RUNNER_TEMP/home" && mkdir -p "$HOME"
          ./install.sh --no-browser --status-url ""
          "$HOME/.local/bin/shuracode" version
